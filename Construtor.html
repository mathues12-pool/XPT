<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construtor de Operações Logísticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f172a;--tx:#1e293b;--mut:#64748b;--line:#e2e8f0;--bg:#eef2f7;--pan:#fff;--acc:#ee4d2d;--acs:#fff1ed;--ok:#16a34a;--r:10px;--sh:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06)}
*{box-sizing:border-box}html,body{margin:0;height:100%;font:13px/1.4 Inter,system-ui,Segoe UI,sans-serif;color:var(--tx);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:fixed;inset:0 0 auto 0;height:56px;background:var(--pan);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ff7a45,#ee4d2d);display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:14px;color:var(--ink);letter-spacing:-.01em}.brand small{color:var(--mut);font-size:11px}
.opn{display:flex;flex-direction:column;gap:1px}.opn label{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}.opn input{border:0;border-bottom:1.5px solid var(--line);background:transparent;font:600 14px Inter;color:var(--ink);padding:1px 0;width:260px;outline:none}.opn input:focus{border-color:var(--acc)}
.sp{flex:1}.grp{display:flex;gap:2px;padding:3px;background:#f1f5f9;border-radius:9px}
.row button{min-width:0;justify-content:center;white-space:normal;text-align:center;line-height:1.2}
button{font:inherit;color:inherit;border:0;background:transparent;border-radius:7px;padding:6px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
button:hover{background:#e8edf4}button:disabled{opacity:.4;cursor:default}button.on{background:#fff;box-shadow:var(--sh);color:var(--ink)}
button.pri{background:var(--acc);color:#fff;font-weight:600;padding:8px 14px}button.pri:hover{background:#d9431f}
button.sec{border:1px solid var(--line);background:#fff}button.sec:hover{background:#f8fafc}
button.dan{color:#b91c1c}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:#fff;width:100%;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(238,77,45,.12)}
aside{position:fixed;top:56px;bottom:26px;background:var(--pan);z-index:10;display:flex;flex-direction:column}
#left{left:0;width:324px;border-right:1px solid var(--line)}#right{right:0;width:300px;border-left:1px solid var(--line)}
.tabs{display:flex;padding:8px 10px 0;gap:2px;border-bottom:1px solid var(--line)}.tabs button{border-radius:8px 8px 0 0;padding:8px 12px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{background:transparent;box-shadow:none;color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.scroll{flex:1;overflow:auto;padding:12px 14px 20px}
h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:16px 0 8px;font-weight:600}h3:first-child{margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.row.one{grid-template-columns:1fr}.row.three{grid-template-columns:1fr 1fr 1fr}
label.l{display:block;font-size:11px;color:var(--mut);margin-bottom:3px}
.seg{display:flex;background:#f1f5f9;border-radius:9px;padding:3px;gap:2px;margin-bottom:8px}.seg button{flex:1;justify-content:center}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0}.chk input{width:auto}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;background:#fff}
.gate{display:grid;grid-template-columns:1.2fr 1fr 1fr 28px;gap:6px;align-items:end;margin-bottom:6px}
.srch{position:relative;margin-bottom:10px}.srch svg{position:absolute;left:9px;top:9px;color:var(--mut)}.srch input{padding-left:30px}
.grpH{display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin:12px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:600}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.it{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:0;overflow:hidden;text-align:left}
.it:hover{border-color:#cbd5e1;box-shadow:var(--sh);background:#fff}.it.sel{border-color:var(--acc);box-shadow:0 0 0 3px rgba(238,77,45,.14)}
.it .th{height:64px;background:linear-gradient(#f8fafc,#eef2f7);display:grid;place-items:center}.it .th img{max-width:100%;max-height:62px}
.it span{padding:6px 8px;font-size:11.5px;font-weight:500;color:var(--ink);line-height:1.2}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px}.kpi{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:8px}.kpi b{display:block;font-size:17px;color:var(--ink);letter-spacing:-.02em}.kpi small{color:var(--mut);font-size:10.5px}
.sum div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}.sum div:last-child{border:0}
.hint{color:var(--mut);font-size:12px;line-height:1.5}.pill{display:inline-block;background:var(--acs);color:#c2410c;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600}
main{position:fixed;top:56px;bottom:26px;left:324px;right:300px}canvas{width:100%;height:100%;display:block;outline:none}
.vbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:5px 8px;box-shadow:var(--sh);backdrop-filter:blur(6px);z-index:3}
.vbar select{width:auto;border:0;background:transparent;font-weight:600;padding:3px 4px}.vbar .sep{width:1px;height:20px;background:var(--line)}
.empty{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}.empty.on{display:grid}
.empty div{background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:var(--sh);border-radius:14px;padding:18px 22px;max-width:380px;text-align:center;pointer-events:auto}
.empty h2{margin:0 0 6px;font-size:16px;color:var(--ink)}.empty p{margin:0 0 12px;color:var(--mut)}
footer{position:fixed;left:0;right:0;bottom:0;height:26px;background:#0f172a;color:#cbd5e1;display:flex;align-items:center;gap:18px;padding:0 14px;font-size:11.5px;z-index:20}
footer b{color:#fff;font-weight:600}footer select{width:auto;background:#1e293b;color:#e2e8f0;border:1px solid #334155;padding:1px 4px;font-size:11px}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;box-shadow:var(--sh)}#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;place-items:center;z-index:50;backdrop-filter:blur(2px)}#modal.on{display:grid}
#mbox{background:#fff;border-radius:16px;padding:20px;width:min(560px,92vw);max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(15,23,42,.3)}#mbox h2{margin:0 0 4px;font-size:17px;color:var(--ink)}
.op{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.op b{flex:1;color:var(--ink)}.op small{color:var(--mut)}
kbd{background:#f1f5f9;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:600 11px Inter}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tp .c{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}.tp .c:hover{border-color:var(--acc);background:var(--acs)}.tp .c b{display:block;color:var(--ink);margin-bottom:2px}
@media(max-width:1000px){#left{width:260px}#right{width:250px}main{left:260px;right:250px}.brand small{display:none}.opn input{width:170px}}
</style></head><body>
<header>

</header>
<aside id="left">

</aside>
<main>

</main>
<aside id="right"><div class="scroll"><div id="props"></div><div id="sum" class="sum"></div></div></aside>
<footer><span id="sCoord">X — · Z —</span><span id="sSel"></span><span class="sp"></span><span>Grade <select id="snapSel"><option value="0.5">0,5 m</option><option value="0.25">0,25 m</option><option value="1">1 m</option><option value="0">livre</option></select></span><span id="sCount"></span></footer>
<div id="toast"></div><div id="modal"><div id="mbox"></div></div>
